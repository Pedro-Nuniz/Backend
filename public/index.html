<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Painel de alunos</h1>
            <p>Demonstração de CRUD Frontend/Backend (Node.js)</p>
            <button onclick="window.print()" style="margin-top: irem; padding: 10px 20px ; font-weight: bold;
            cursor: pointer; border-radius: 8px; border: none; background: white; color: var(--primary-color);">
                ⬇️ Baixar PDF
            </button>
        </header>

        <main>
            <section class="form-section">
                <h2>Novo Aluno</h2>

                <form id="aluno-form">
                    <input type="hidden" id="aluno-id">

                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" required placeholder="Ex: Fulano  Tal ">
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required placeholder="Ex: email@email.com">
                    </div>

                    <div class="input-group">
                        <label for="curso">Curso</label>
                        <Select id="cursor" required>
                            <option value="">Selecione um curso...</option>
                            <option value="Análise de sistemas "> Análise de Sistema </option>
                            <option value="Engenharia de Software "> Engenharia de Software </option>
                            <option value="Ciência da Computação ">Ciência da Computação </option>
                        </Select>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-cancel" id="btn-cancel" style="display: none;">Cancelar Edição</button>
                        <button type="submit" class="btn-save" id="btn-save">Salvar Aluno</button>
                    </div>
                </form>
            </section>
            <section class="listen-section">
              <h2>Alunos Cadastrados</h2>
              <div class="table-container">
                 <table>
                    <thead><tr>
                            <th>ID</th>                         
                            <th>Nome</th>
                            <th>E-email</th>
                            <th>Curso</th>
                            <th>Ações</th>  
                        </tr>
                    </thead>
                    <tbody id="alunos-tbody">
                     <!--Alunos injetados aqui via JavaScript-->
                    </tbody>
                 </table>
              </div>
            </section>
        </main>
    </div>
</body>

</html>
